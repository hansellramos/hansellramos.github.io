name: Build and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: touch dist/.nojekyll

      # Only master goes live. GitHub Pages serves the gh-page branch, so the
      # build is committed on top of it (history is kept, nothing is force-pushed).
      - name: Publish to gh-page
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin gh-page
          git worktree add ../site origin/gh-page
          cd ../site
          git checkout -B gh-page
          git rm -rq --ignore-unmatch .
          cp -r "$GITHUB_WORKSPACE/dist/." .
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}" || echo "Nothing to deploy"
          git push origin gh-page
